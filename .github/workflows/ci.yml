name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src api dags tests scripts
      - name: Unit tests
        run: pytest -q
      - name: Pipeline smoke test (synthetic data, no network)
        run: |
          python scripts/make_synthetic_data.py
          python -m src.pipeline ingest && python -m src.pipeline validate && python -m src.pipeline features
          python -m src.pipeline train && python -m src.pipeline evaluate
          python -m src.report
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t recsys-api .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with: {image-ref: recsys-api, severity: "CRITICAL,HIGH", exit-code: "0"}
